plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.uscutout'
version = '0.1.0'

android {
  namespace "expo.modules.uscutout"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // On-device subject segmentation (the model comes from Google Play services).
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
